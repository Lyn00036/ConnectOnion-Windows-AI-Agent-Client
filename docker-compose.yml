services:
  postgres:
    image: postgres:15
    container_name: connectonion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: connectonion
      POSTGRES_PASSWORD: connectonion_pass
      POSTGRES_DB: connectonion_db
    ports:
      - "5432:5432"
    volumes:
      - connectonion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectonion -d connectonion_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: connectonion-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://connectonion:connectonion_pass@postgres:5432/connectonion_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: connectonion-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  connectonion_pg_data:
