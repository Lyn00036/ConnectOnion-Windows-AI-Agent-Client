name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winui:
    name: WinUI 3 / .NET
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOLUTION_PATH: ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
      CONFIGURATION: Release
      # NOTE: do not name this "PLATFORM" — env vars are case-insensitive on
      # Windows and MSBuild auto-imports them as properties, so "PLATFORM"
      # leaks in as $(Platform)=x64 for standalone `dotnet run` calls and makes
      # them look for output under bin\x64\... that the solution build (which
      # maps the conformance project to Any CPU) never produced.
      BUILD_PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js for protocol conformance
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          node --version

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION_PATH -p:Platform=$env:BUILD_PLATFORM

      - name: Build WinUI solution
        shell: pwsh
        run: >
          dotnet build $env:SOLUTION_PATH
          --configuration $env:CONFIGURATION
          --no-restore
          -p:Platform=$env:BUILD_PLATFORM
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=false
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Run protocol unit tests
        shell: pwsh
        run: dotnet test tests/ConnectOnion.Protocol.Tests/ConnectOnion.Protocol.Tests.csproj --configuration $env:CONFIGURATION

      - name: Run WinUI client headless unit tests
        shell: pwsh
        run: dotnet test tests/ConnectOnion.WinUIClient.UnitTests/ConnectOnion.WinUIClient.UnitTests.csproj --configuration $env:CONFIGURATION

      - name: Run database integration tests
        shell: pwsh
        run: dotnet test tests/ConnectOnion.IntegrationTests/ConnectOnion.IntegrationTests.csproj --configuration $env:CONFIGURATION

      - name: Run protocol conformance gate
        shell: pwsh
        run: >
          dotnet run
          --project ConnectOnion.Protocol.Conformance/ConnectOnion.Protocol.Conformance.csproj
          --configuration $env:CONFIGURATION
          --no-build
