name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winui:
    name: WinUI 3 / .NET
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOLUTION_PATH: ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js for protocol conformance
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          node --version

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION_PATH -p:Platform=$env:PLATFORM

      - name: Build WinUI solution
        shell: pwsh
        run: >
          dotnet build $env:SOLUTION_PATH
          --configuration $env:CONFIGURATION
          --no-restore
          -p:Platform=$env:PLATFORM
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=false
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Run protocol conformance gate
        shell: pwsh
        run: >
          dotnet run
          --project ConnectOnion.Protocol.Conformance/ConnectOnion.Protocol.Conformance.csproj
          --configuration $env:CONFIGURATION
          --no-build
