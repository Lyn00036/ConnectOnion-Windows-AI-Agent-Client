name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_ui_smoke:
        description: Run the interactive WinUI shell smoke test
        type: boolean
        default: false
      run_trim_audit:
        description: Run the trimming gate audit (experimental trimmed publish + smoke harness)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winui:
    name: WinUI 3 / .NET
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOLUTION_PATH: ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
      CONFIGURATION: Release
      # NOTE: do not name this "PLATFORM" — env vars are case-insensitive on
      # Windows and MSBuild auto-imports them as properties, so "PLATFORM"
      # leaks in as $(Platform)=x64 for standalone `dotnet run` calls and makes
      # them look for output under bin\x64\... that the solution build (which
      # maps the conformance project to Any CPU) never produced.
      BUILD_PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js for protocol conformance
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          node --version

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION_PATH -p:Platform=$env:BUILD_PLATFORM

      - name: Audit NuGet dependencies
        shell: pwsh
        run: dotnet list $env:SOLUTION_PATH package --vulnerable --include-transitive

      - name: Build WinUI solution
        shell: pwsh
        run: >
          dotnet build $env:SOLUTION_PATH
          --configuration $env:CONFIGURATION
          --no-restore
          -p:Platform=$env:BUILD_PLATFORM
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=false
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Run protocol unit tests
        shell: pwsh
        run: dotnet test tests/ConnectOnion.Protocol.Tests/ConnectOnion.Protocol.Tests.csproj --configuration $env:CONFIGURATION --collect:"XPlat Code Coverage" --results-directory TestResults/protocol

      - name: Run WinUI client headless unit tests
        shell: pwsh
        run: dotnet test tests/ConnectOnion.WinUIClient.UnitTests/ConnectOnion.WinUIClient.UnitTests.csproj --configuration $env:CONFIGURATION --collect:"XPlat Code Coverage" --results-directory TestResults/client

      - name: Run database integration tests
        shell: pwsh
        run: dotnet test tests/ConnectOnion.IntegrationTests/ConnectOnion.IntegrationTests.csproj --configuration $env:CONFIGURATION --collect:"XPlat Code Coverage" --results-directory TestResults/integration

      - name: Compile UI smoke tests
        shell: pwsh
        run: dotnet test tests/ConnectOnion.WinUIClient.UITests/ConnectOnion.WinUIClient.UITests.csproj --configuration $env:CONFIGURATION

      - name: Publish ReadyToRun unpackaged build
        shell: pwsh
        run: >
          dotnet publish ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.csproj
          --configuration $env:CONFIGURATION
          --runtime win-x64
          --no-restore
          -p:Platform=$env:BUILD_PLATFORM
          -p:RunUnpackaged=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=true
          -p:AppxPackageSigningEnabled=false

      - name: Run interactive UI smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke }}
        shell: pwsh
        env:
          CONNECTONION_UI_TEST_EXE: ${{ github.workspace }}\ConnectOnion.WinUIClient\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish\ConnectOnion.WinUIClient.exe
        run: dotnet test tests/ConnectOnion.WinUIClient.UITests/ConnectOnion.WinUIClient.UITests.csproj --configuration $env:CONFIGURATION --no-build

      # The cheap half of the trimming gate, on every run: it publishes only the small console
      # harness (not the app), and it is the check that fails the moment a reflection-based
      # JsonSerializer call returns to a persistence or protocol path. The expensive half — the
      # experimental trimmed publish of the app and its warning inventory — is opt-in below.
      # docs/TRIMMING.md explains why a clean warning inventory is not the same as trim-safe.
      - name: Run trimmed serialization smoke harness
        shell: pwsh
        run: pwsh scripts/Invoke-TrimAudit.ps1 -SmokeOnly

      - name: Run full trimming gate audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_trim_audit }}
        shell: pwsh
        run: pwsh scripts/Invoke-TrimAudit.ps1

      - name: Upload trimming gate report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_trim_audit }}
        uses: actions/upload-artifact@v4
        with:
          name: trim-audit
          path: |
            artifacts/trim-audit/trim-audit.json
            artifacts/trim-audit/*.log
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Run protocol conformance gate
        shell: pwsh
        run: >
          dotnet run
          --project ConnectOnion.Protocol.Conformance/ConnectOnion.Protocol.Conformance.csproj
          --configuration $env:CONFIGURATION
          --no-build
